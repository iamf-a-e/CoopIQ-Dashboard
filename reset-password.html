<!DOCTYPE html>
<html lang="en"><head><title>CoopIQ | Reset password</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="img/logo-sm.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="js/config.js"></script></head>
<body class="authpage" data-page="reset"><div class="auth">
<img class="logo" src="img/logo.png" alt="CoopIQ logo"><p class="tag">Choose a new password</p>
<div class="card"><h2>Reset your password</h2>
<form id="form" class="form" novalidate>
<div><label for="pass">New password</label><input id="pass" type="password" minlength="6" autocomplete="new-password" required></div>
<div><label for="pass2">Confirm password</label><input id="pass2" type="password" autocomplete="new-password" required></div>
<p id="msg" class="msgbox" role="status"></p>
<button class="btn p" type="submit">Update password</button>
<a class="link" href="login.html">Back to sign in</a>
</form></div></div>
<script src="js/auth.js"></script></body></html>
